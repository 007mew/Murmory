name: murmory
description: Speak it. Find it. — Private searchable voice memory.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.3
  drift: 2.29.0
  drift_flutter: 0.2.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.1
  gap: ^3.0.1
  go_router: ^14.2.7
  intl: ^0.19.0
  just_audio: ^0.9.40
  path: ^1.9.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  record: 5.2.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.3.1
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.6.0
  drift_dev: 2.29.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  record_linux: 0.7.1

flutter:
  uses-material-design: true
